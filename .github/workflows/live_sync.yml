STREAMING_CHUNK:Configuring workflow trigger events...

name: Fera Live Sync Engine

on:
workflow_dispatch:
schedule:
- cron: '*/10 15-21 * * *'

STREAMING_CHUNK:Defining runner environment and permissions...

jobs:
sync-live-data:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: '3.11'
- name: Run sync worker
env:
SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
run: |
pip install requests supabase
python production_sync_worker.py
