STREAMING_CHUNK:Defining GitHub Actions workflow metadata and triggers

name: Fera Live Sync Engine

on:
schedule:
# اجرا در ساعات اوج مسابقات فوتبال اروپا (۱۹:۰۰ تا ۰۰:۳۰ به وقت ایران / ۱۵:۳۰ تا ۲۱:۰۰ UTC)
# هر ۱۰ دقیقه یک‌بار به طور خودکار فعال می‌شود
- cron: '*/10 15-21 * * *'
workflow_dispatch: # امکان اجرای دستی در هر لحظه با زدن دکمه Run workflow

STREAMING_CHUNK:Configuring the runner environment and dependencies

jobs:
sync-live-data:
runs-on: ubuntu-latest
timeout-minutes: 10

steps:
  - name: 📥 دریافت کدهای پروژه
    uses: actions/checkout@v4

  - name: 🐍 راه‌اندازی مفسر پایتون
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'
      cache: 'pip'

  - name: 📦 نصب کتابخانه‌های مورد نیاز
    run: |
      python -m pip install --upgrade pip
      pip install requests supabase

  # STREAMING_CHUNK:Executing production worker with injected secrets
  - name: ⚡ اجرای ورکر پایش بلادرنگ مسابقات
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
    run: |
      python production_sync_worker.py
