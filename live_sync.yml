name: Fera Analyze Cloud Engine

on:
  schedule:
    # ساعت ۱:۳۰ بامداد UTC (معادل ۵:۰۰ صبح به وقت تهران) جهت لود روزانه مسابقات
    - cron: '30 1 * * *'
    # اجرای مداوم هر ۳۰ دقیقه جهت پایش نتایج زنده، دقیقه بازی و تسویه سوت پایان
    - cron: '*/30 * * * *'
  workflow_dispatch: # قابلیت اجرای دستی در هر لحظه

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت آخرین کدها
        uses: actions/checkout@v4

      - name: راه‌اندازی مفسر پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: نصب پکیج‌ها
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: اجرای ورکر تمام خودکار
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python production_sync_worker.py
